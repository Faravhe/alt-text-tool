<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture sketch, model runs natively</title>
<desc>Draft diagram showing the Mac M4 Pro host machine with the vision-language model running natively via MLX, and a separate Docker container isolating the local web UI and testing tools, with image data flowing in and alt-text output flowing out.</desc>
<defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2937; }
  .ts { font-size: 12px; fill: #4b5563; }
  .c-gray rect { fill: #f9fafb; stroke: #9ca3af; }
  .c-teal rect { fill: #e6fffa; stroke: #0d9488; }
  .c-purple rect { fill: #f3e8ff; stroke: #9333ea; }
  .c-coral rect { fill: #fff1f0; stroke: #f43f5e; }
  .arr { stroke: #374151; stroke-width: 1.5; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g class="c-gray">
<rect x="60" y="90" width="560" height="300" rx="20" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="340" y="118" text-anchor="middle">Mac (M4 Pro), host machine</text>
<text class="ts" x="340" y="136" text-anchor="middle">Model runs natively, Docker isolates the rest</text>
</g>

<g class="c-purple">
<rect x="90" y="180" width="220" height="100" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="220" text-anchor="middle">VLM model</text>
<text class="ts" x="200" y="240" text-anchor="middle">Runs natively via MLX</text>
</g>

<g class="c-teal">
<rect x="340" y="160" width="260" height="190" rx="12" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="470" y="185" text-anchor="middle">Docker container</text>
<text class="ts" x="470" y="201" text-anchor="middle">Web UI and testing tools</text>
</g>

<g class="c-coral">
<rect x="370" y="210" width="200" height="100" rx="8" stroke-width="0.5"/>
<text class="th" x="470" y="250" text-anchor="middle">Local web UI</text>
<text class="ts" x="470" y="270" text-anchor="middle">Preview and test</text>
</g>

<text class="ts" x="10" y="225">Image data</text>
<line x1="60" y1="225" x2="88" y2="225" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="333" y="228" text-anchor="end">Alt-text</text>
<line x1="310" y1="235" x2="368" y2="258" class="arr" marker-end="url(#arrow)"/>

<line x1="470" y1="310" x2="470" y2="400" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="418" text-anchor="middle">Alt-text output, for screen readers</text>
</svg>
