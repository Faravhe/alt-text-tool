<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Alt Text Generator</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>
	<div class="container">
		<h1>Alt-Text Genarator</h1>
		<p>Upload an image to generate  alt-text for screen readers.</p>

		<form action="/upload" method="POST" enctype="multipart/form-data">
			<label for="image-upload">Choose an image file</label>
			<input type="file" id="image-upload" name="image" accept="image/*" required>
			<button type="submit">Generate Alt-Text</button>
		</form>
	</div>	
</body>
</html>
